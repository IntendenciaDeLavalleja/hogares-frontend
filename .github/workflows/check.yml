name: Frontend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm audit
      - name: Construir imagen independiente y verificar Nginx
        run: |
          docker build --build-arg VITE_API_URL=https://api-hogares.example.uy/api --build-arg VITE_APPLICATION_YEAR=2027 -t hogares-frontend:check .
          docker run --rm hogares-frontend:check nginx -t
          docker run -d --name frontend-check -p 8080:8080 hogares-frontend:check
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/solicitud > /dev/null
          curl -fsSI http://127.0.0.1:8080/ | grep -F "connect-src 'self' https://api-hogares.example.uy;"
      - name: Detener imagen de prueba
        if: always()
        run: docker rm -f frontend-check || true
