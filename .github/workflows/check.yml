name: Frontend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: npm audit
      - name: Construir imagen independiente y verificar Nginx
        run: |
          docker build --build-arg VITE_API_URL=https://api-hogares.example.uy/api --build-arg VITE_APPLICATION_YEAR=2027 -t hogares-frontend:check .
          docker run --rm hogares-frontend:check nginx -t
          docker run -d --name frontend-check -p 8080:8080 hogares-frontend:check
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/solicitud > /dev/null
          curl -fsSI http://127.0.0.1:8080/ | grep -F "connect-src 'self' https://api-hogares.example.uy;"
      - name: Detener imagen de prueba
        if: always()
        run: docker rm -f frontend-check || true
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: IntendenciaDeLavalleja/hogares-backend
          ref: main
          path: .integration-backend
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .integration-backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libmariadb-dev pkg-config
      - run: pip install -r .integration-backend/requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Inscripción completa con API, archivos y captcha reales
        env:
          VITE_API_URL: http://127.0.0.1:5001/api
          VITE_APPLICATION_YEAR: '2027'
          PLAYWRIGHT_API_URL: http://127.0.0.1:5001/api
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          python .integration-backend/tests/browser_server.py > integration-api.log 2>&1 &
          api_pid=$!
          npm run build
          node scripts/serve-integration.mjs > integration-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$api_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/health/live > /dev/null && curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:integration
      - name: Logs de integración si falla
        if: failure()
        run: cat integration-api.log integration-frontend.log 2>/dev/null || true
