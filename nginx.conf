server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' __API_ORIGIN__; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # La API y el panel administrativo se sirven en el dominio del backend.
    location ~ ^/(?:api|admin|auth|health)(?:/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 1d;
        try_files $uri =404;
    }
}
